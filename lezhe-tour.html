  <link rel="preconnect" href="https://fonts.googleapis.com">

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --gold: #c9a84c;
      --gold-dark: #a8893d;
      --text: #f0ece2;
      --text-muted: #a09b8f;
      --panel-bg: rgba(10, 10, 10, 0.92);
      --panel-border: rgba(201, 168, 76, 0.2);
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Loading Screen */
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading-logo { width: 180px; margin-bottom: 30px; opacity: 0.9; }
    .loading-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .loading-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .loading-bar-track {
      width: 200px; height: 2px;
      background: rgba(201,168,76,0.15);
      border-radius: 2px; overflow: hidden;
    }
    .loading-bar-fill {
      height: 100%; width: 0%;
      background: var(--gold);
      animation: loadProgress 2s ease-in-out forwards;
    }
    @keyframes loadProgress { 0%{width:0%} 60%{width:70%} 100%{width:100%} }

    /* Main Layout */
    .tour-wrapper { display: flex; height: 100vh; width: 100vw; }

    /* Sidebar */
    .sidebar {
      width: 300px; min-width: 300px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex; flex-direction: column;
      z-index: 100;
      transition: transform 0.3s ease;
    }
    .sidebar-header {
      padding: 16px; border-bottom: 1px solid var(--panel-border);
      display: flex; align-items: center; gap: 12px;
    }
    .sidebar-logo { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; }
    .sidebar-brand h2 {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem; font-weight: 600; color: var(--gold);
    }
    .sidebar-brand p { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
    .sidebar-nav::-webkit-scrollbar { width: 3px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }

    .floor-label {
      padding: 10px 16px 4px;
      font-size: 0.6rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--gold);
      display: flex; align-items: center; gap: 8px;
    }
    .floor-label::after { content:''; flex:1; height:1px; background: var(--panel-border); }
    .scene-btn {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 8px 16px;
      background: none; border: none;
      color: var(--text-muted);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem; cursor: pointer; text-align: left;
      transition: all 0.15s ease;
    }
    .scene-btn:hover { background: rgba(201,168,76,0.08); color: var(--text); }
    .scene-btn.active { background: rgba(201,168,76,0.12); color: var(--gold); border-left: 2px solid var(--gold); }

    .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--panel-border); }
    .back-btn {
      display: flex; align-items: center; gap: 8px;
      color: var(--text-muted); text-decoration: none;
      font-size: 0.75rem; font-weight: 500;
      transition: color 0.2s; padding: 6px 0;
    }
    .back-btn:hover { color: var(--gold); }
    .back-btn svg { width: 14px; height: 14px; }

    /* Panorama Container */
    .pano-container { flex: 1; position: relative; min-width: 0; }
    #panorama { width: 100%; height: 100%; }

    /* Top Bar */
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
      pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }
    .current-scene-label {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }
    .current-scene-floor {
      font-size: 0.65rem; color: var(--gold);
      text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .top-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.4); color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
      backdrop-filter: blur(8px);
    }
    .top-btn:hover { border-color: #fff; background: rgba(255,255,255,0.15); }
    .top-btn svg { width: 16px; height: 16px; }

    /* Sidebar Toggle (mobile) */
    .sidebar-toggle {
      display: none;
      position: absolute; top: 14px; left: 14px; z-index: 200;
      width: 40px; height: 40px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.6); color: #fff;
      cursor: pointer; align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
    }
    .sidebar-toggle svg { width: 18px; height: 18px; }

    /* Scene Counter */
    .scene-counter {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 50;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px; padding: 8px 18px;
      font-size: 0.8rem; color: rgba(255,255,255,0.8);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; gap: 14px;
    }
    .scene-counter .nav-arrow {
      background: none; border: none;
      color: rgba(255,255,255,0.6); cursor: pointer;
      padding: 4px; display: flex; transition: color 0.2s;
    }
    .scene-counter .nav-arrow:hover { color: #fff; }
    .scene-counter .nav-arrow svg { width: 16px; height: 16px; }

    /* ========== WHITE FLOOR HOTSPOTS (Google Street View style) ========== */
    .pnlm-hotspot-base { cursor: pointer !important; }
    .pnlm-scene-hotspot { width: 0 !important; height: 0 !important; }
    .pnlm-tooltip { display: none !important; }
    .pnlm-about-msg { display: none !important; }
    .pnlm-hot-spot-debug-indicator { display: none !important; }
    .pnlm-compass { filter: brightness(0.8) sepia(0.5) hue-rotate(5deg); }

    /* The white circle on the floor */
    .floor-hotspot {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      border: 3px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 12px rgba(0,0,0,0.4), 0 0 0 2px rgba(0,0,0,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    .floor-hotspot:hover {
      transform: scale(1.2);
      background: rgba(255, 255, 255, 1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 0 3px rgba(255,255,255,0.3);
    }
    .floor-hotspot:active {
      transform: scale(0.95);
    }

    /* Arrow inside the circle */
    .floor-hotspot svg {
      width: 22px;
      height: 22px;
      color: #333;
      transition: color 0.2s;
    }
    .floor-hotspot:hover svg {
      color: #000;
    }

    /* Pulsing ring animation */
    .floor-hotspot::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      animation: floorPulse 2.5s ease-in-out infinite;
    }

    /* Label that appears on hover */
    .floor-hotspot-label {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      letter-spacing: 0.02em;
    }
    .floor-hotspot-label::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: rgba(0, 0, 0, 0.8);
    }
    .floor-hotspot:hover .floor-hotspot-label {
      opacity: 1;
    }

    /* Stair hotspot variant (for going up/down floors) */
    .floor-hotspot.stairs-up {
      background: rgba(201, 168, 76, 0.85);
      border-color: rgba(201, 168, 76, 0.95);
    }
    .floor-hotspot.stairs-up:hover {
      background: rgba(201, 168, 76, 1);
    }
    .floor-hotspot.stairs-up svg { color: #fff; }
    .floor-hotspot.stairs-up:hover svg { color: #fff; }
    .floor-hotspot.stairs-up::before {
      border-color: rgba(201, 168, 76, 0.4);
    }

    @keyframes floorPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 0; }
    }

    /* Pannellum overrides */
    .pnlm-container { background: #111 !important; }
    .pnlm-load-box { display: none !important; }

    /* Fullscreen */
    .tour-wrapper.fullscreen { position: fixed; inset: 0; z-index: 10000; }

    /* Mobile */
    @media (max-width: 900px) {
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 500;
        transform: translateX(-100%);
        box-shadow: 4px 0 20px rgba(0,0,0,0.5);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-toggle { display: flex; }
      .sidebar-overlay {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.5); z-index: 400;
      }
      .sidebar-overlay.open { display: block; }
      .top-bar { padding-left: 62px; }
      .floor-hotspot { width: 42px; height: 42px; }
      .floor-hotspot svg { width: 18px; height: 18px; }
    }
    @media (max-width: 480px) {
      .sidebar { width: 260px; min-width: 260px; }
      .current-scene-label { font-size: 0.9rem; }
      .floor-hotspot { width: 38px; height: 38px; }
    }
  </style>
</head>

    // ── Build Pannellum Config ──
    function buildConfig() {
      const basePath = "assets/Lezhe/virtual-tour/";
      const pScenes = {};

      scenes.forEach(function(s) {
        var hotSpots = [];
        var conns = connections[s.id] || [];

        conns.forEach(function(c) {
          hotSpots.push({
            pitch: c.pitch,
            yaw: c.yaw,
            type: "scene",
            sceneId: c.to,
            text: c.label,
            cssClass: "floor-hotspot-wrapper",
            createTooltipFunc: function(div, args) {
              div.classList.add('floor-hotspot');
              if (args.stairs) div.classList.add('stairs-up');

              // Arrow SVG pointing forward
              div.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>';

              // Label
              var label = document.createElement('div');
              label.className = 'floor-hotspot-label';
              label.textContent = args.label;
              div.appendChild(label);
            },
            createTooltipArgs: { label: c.label, stairs: c.stairs || false }
          });
        });

        pScenes[s.id] = {
          title: s.title,
          panorama: basePath + s.file,
          pitch: -5,
          yaw: 0,
          hfov: 110,
          type: "equirectangular",
          autoLoad: true,
          hotSpots: hotSpots
        };
      });

      return {
        default: {
          firstScene: "s001",
          sceneFadeDuration: 600,
          autoRotate: -1.5,
          autoRotateInactivityDelay: 8000,
          compass: true,
          showControls: false,
          mouseZoom: true,
          draggable: true,
          keyboardZoom: true,
          friction: 0.15,
          minHfov: 50,
          maxHfov: 120
        },
        scenes: pScenes
      };
    }

    // ── Build Sidebar ──
    function buildSidebar() {
      var nav = document.getElementById('sidebarNav');
      var html = '';

      floorOrder.forEach(function(floor) {
        var items = scenes.filter(function(s) { return s.floor === floor; });
        if (items.length === 0) return;
        html += '<div class="floor-group"><div class="floor-label">' + floor + '</div>';
        items.forEach(function(s) {
          html += '<button class="scene-btn" data-scene="' + s.id + '" onclick="goToScene(\'' + s.id + '\')">' + s.title + '</button>';
        });
        html += '</div>';
      });
      nav.innerHTML = html;
    }

    // ── Init ──
    var viewer;
    var currentIndex = 0;

    function initTour() {
      var config = buildConfig();
      viewer = pannellum.viewer('panorama', config);

      viewer.on('scenechange', function(sceneId) {
        updateUI(sceneId);
      });

      buildSidebar();
      updateUI('s001');

      setTimeout(function() {
        document.getElementById('loadingScreen').classList.add('hidden');
      }, 2200);
    }

    function updateUI(sceneId) {
      var scene = scenes.find(function(s) { return s.id === sceneId; });
      if (!scene) return;
      currentIndex = scenes.indexOf(scene);

      document.getElementById('currentSceneLabel').textContent = scene.title;
      document.getElementById('currentSceneFloor').textContent = scene.floor;
      document.getElementById('sceneCounterText').textContent = (currentIndex + 1) + ' / ' + scenes.length;

      document.querySelectorAll('.scene-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.scene === sceneId);
      });

      var activeBtn = document.querySelector('.scene-btn.active');
      if (activeBtn) activeBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function goToScene(sceneId) {
      viewer.loadScene(sceneId);
      if (window.innerWidth <= 900) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
      }
    }

    // Controls
    document.getElementById('prevScene').addEventListener('click', function() {
      var prev = (currentIndex - 1 + scenes.length) % scenes.length;
      viewer.loadScene(scenes[prev].id);
    });
    document.getElementById('nextScene').addEventListener('click', function() {
      var next = (currentIndex + 1) % scenes.length;
      viewer.loadScene(scenes[next].id);
    });
    document.getElementById('btnFullscreen').addEventListener('click', function() {
      if (!document.fullscreenElement) {
        document.getElementById('tourWrapper').requestFullscreen().catch(function(){});
      } else {
        document.exitFullscreen();
      }
    });
    document.getElementById('sidebarToggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('open');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', function() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('open');
    });

    window.addEventListener('load', initTour);
  </script>
